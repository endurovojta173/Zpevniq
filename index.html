<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zpěvník na hody 2026</title>
    <meta name="description" content="Zpěvník na hody 2026" />
    <meta name="theme-color" content="#fbf7f0" />
    <meta name="color-scheme" content="light" />

    <link rel="canonical" href="https://endurovojta173.github.io/Zpevniq/" />

    <!-- Náhled při sdílení odkazu (Open Graph pro WhatsApp, Messenger, Facebook atd.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zpěvník na hody 2026" />
    <meta property="og:url" content="https://endurovojta173.github.io/Zpevniq/" />
    <meta property="og:title" content="Zpěvník na hody 2026" />
    <meta property="og:description" content="Zpěvník na hody 2026" />
    <meta property="og:image" content="https://endurovojta173.github.io/Zpevniq/icons/icon-512.png" />
    <meta property="og:image:secure_url" content="https://endurovojta173.github.io/Zpevniq/icons/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Zpěvník na hody 2026" />
    <meta property="og:locale" content="cs_CZ" />

    <!-- Náhled pro Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zpěvník na hody 2026" />
    <meta name="twitter:description" content="Zpěvník na hody 2026" />
    <meta name="twitter:image" content="https://endurovojta173.github.io/Zpevniq/icons/icon-512.png" />
    <meta name="twitter:image:alt" content="Zpěvník na hody 2026" />

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />

    <script>
      // Velikost písma nastavíme dřív, než se stránka vykreslí — ať text neposkočí.
      (function () {
        try {
          var font = localStorage.getItem('zpevnik:font');
          if (font === 'small' || font === 'medium' || font === 'large') {
            document.documentElement.dataset.font = font;
          }
        } catch (error) {
          /* soukromý režim bez localStorage — jede se na výchozí hodnoty */
        }
      })();
    </script>
  </head>

  <body>
    <a class="skip-link" href="#main">Přeskočit na obsah</a>

    <header class="site-header">
      <div class="bar">
        <a class="brand" href="#/">Zpěvník na hody 2026</a>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <section id="view-list" aria-labelledby="list-heading">
        <h1 class="sr-only" id="list-heading" tabindex="-1">Zpěvník na hody 2026</h1>

        <ul class="song-list" id="song-list"></ul>

        <noscript>
          <p class="notice">Zpěvník potřebuje zapnutý JavaScript. Zapni ho prosím v nastavení prohlížeče a obnov stránku.</p>
        </noscript>
      </section>

      <article id="view-song" aria-labelledby="song-title" hidden>
        <div class="song-nav">
          <a class="back-link" href="#/">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M19 12H5M11 18l-6-6 6-6" />
            </svg>
            Zpěvník
          </a>

          <div class="font-controls" role="group" aria-label="Velikost písma">
            <button class="font-button" type="button" data-font-size="small" aria-pressed="false" aria-label="Malé písmo">
              A
            </button>
            <button class="font-button" type="button" data-font-size="medium" aria-pressed="true" aria-label="Střední písmo">
              A
            </button>
            <button class="font-button" type="button" data-font-size="large" aria-pressed="false" aria-label="Velké písmo">
              A
            </button>
          </div>
        </div>

        <h1 class="song-title" id="song-title" tabindex="-1"></h1>
        <p class="song-meta" id="song-meta"></p>
        <div class="lyrics" id="song-text"></div>
      </article>
    </main>

    <footer class="site-footer">
      <p>Texty lidových písní. Přidej si zpěvník na plochu a funguje i bez signálu.</p>
    </footer>

    <script src="./data/songs.js"></script>
    <script src="./assets/lib.js"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>
